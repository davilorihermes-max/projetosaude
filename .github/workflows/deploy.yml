name: CD - Deploy Vercel Produção

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-to-vercel:
    name: Deploy to Vercel (Produção & Staging)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_RpKVpxFoir8lacl7PWD1pEc4' }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_RDQy7TzUtzmIWeB2wGA1OfWtwOLw' }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN secret não está configurado no repositório."
            echo "Para habilitar deploy automático contínuo para Sérgio e Davi, adicione o secret VERCEL_TOKEN no GitHub (Settings -> Secrets and variables -> Actions)."
            exit 0
          fi
          node scripts/deploy.js
